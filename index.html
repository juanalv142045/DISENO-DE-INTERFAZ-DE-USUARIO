<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego del Ahorcado</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }

    .game-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      margin-bottom: 20px;
      color: #2c3e50;
    }

    /* Dibujo del Ahorcado */
    .gallows-svg {
      width: 180px;
      height: 200px;
      stroke: #34495e;
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-bottom: 20px;
    }

    .body-part {
      display: none;
    }

    /* Palabra Secreta */
    .word-display {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
      min-height: 45px;
    }

    .letter-slot {
      font-size: 2rem;
      font-weight: bold;
      border-bottom: 4px solid #34495e;
      width: 35px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
    }

    /* Mensajes y Estado */
    .message {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 15px;
      min-height: 1.5em;
    }

    .message.win {
      color: #27ae60;
    }

    .message.lose {
      color: #e74c3c;
    }

    /* Teclado Virtual */
    .keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .key {
      background-color: #ecf0f1;
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      width: 36px;
      height: 40px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .key:hover:not(:disabled) {
      background-color: #d5dbdb;
    }

    .key:active:not(:disabled) {
      transform: scale(0.95);
    }

    .key:disabled {
      background-color: #bdc3c7;
      color: #7f8c8d;
      cursor: not-allowed;
      border-color: #bdc3c7;
    }

    /* Botón Reiniciar */
    .reset-btn {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .reset-btn:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>El Ahorcado</h1>

    <!-- SVG del Ahorcado -->
    <svg class="gallows-svg" viewBox="0 0 100 120">
      <!-- Base y Horca (Siempre visibles) -->
      <line x1="10" y1="115" x2="90" y2="115" />
      <line x1="30" y1="115" x2="30" y2="10" />
      <line x1="30" y1="10" x2="70" y2="10" />
      <line x1="70" y1="10" x2="70" y2="25" />

      <!-- Partes del Cuerpo (Visibles progresivamente) -->
      <circle id="head" class="body-part" cx="70" cy="35" r="10" />
      <line id="torso" class="body-part" x1="70" y1="45" x2="70" y2="80" />
      <line id="left-arm" class="body-part" x1="70" y1="55" x2="55" y2="70" />
      <line id="right-arm" class="body-part" x1="70" y1="55" x2="85" y2="70" />
      <line id="left-leg" class="body-part" x1="70" y1="80" x2="55" y2="100" />
      <line id="right-leg" class="body-part" x1="70" y1="80" x2="85" y2="100" />
    </svg>

    <!-- Espacios para la palabra -->
    <div id="word-display" class="word-display"></div>

    <!-- Mensaje de victoria/derrota -->
    <div id="message" class="message"></div>

    <!-- Teclado Virtual -->
    <div id="keyboard" class="keyboard"></div>

    <!-- Botón de reinicio -->
    <button id="reset-btn" class="reset-btn">Nuevo Juego</button>
  </div>

  <script>
    // Configuración e Inicialización
    const WORDS = ["PROGRAMACION", "DESARROLLO", "JAVASCRIPT", "TECLADO", "AHORCADO", "NAVEGADOR", "INTERNET", "ALGORITMO"];
    const MAX_ERRORS = 6;
    const BODY_PARTS = ["head", "torso", "left-arm", "right-arm", "left-leg", "right-leg"];

    let secretWord = "";
    let guessedLetters = new Set();
    let errorCount = 0;

    const wordDisplay = document.getElementById("word-display");
    const keyboard = document.getElementById("keyboard");
    const message = document.getElementById("message");
    const resetBtn = document.getElementById("reset-btn");

    // Iniciar Juego
    function initGame() {
      secretWord = WORDS[Math.floor(Math.random() * WORDS.length)];
      guessedLetters.clear();
      errorCount = 0;
      message.textContent = "";
      message.className = "message";

      // Ocultar cuerpo del ahorcado
      BODY_PARTS.forEach(partId => {
        document.getElementById(partId).style.display = "none";
      });

      renderWord();
      renderKeyboard();
    }

    // Dibujar la palabra con guiones o letras descubiertas
    function renderWord() {
      wordDisplay.innerHTML = "";
      for (const letter of secretWord) {
        const slot = document.createElement("div");
        slot.className = "letter-slot";
        slot.textContent = guessedLetters.has(letter) ? letter : "";
        wordDisplay.appendChild(slot);
      }
    }

    // Crear botones del teclado (A-Z y Ñ)
    function renderKeyboard() {
      keyboard.innerHTML = "";
      const alphabet = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
      
      for (const letter of alphabet) {
        const button = document.createElement("button");
        button.className = "key";
        button.textContent = letter;
        button.disabled = guessedLetters.has(letter) || isGameOver();
        button.addEventListener("click", () => handleGuess(letter));
        keyboard.appendChild(button);
      }
    }

    // Procesar la letra elegida
    function handleGuess(letter) {
      if (guessedLetters.has(letter) || isGameOver()) return;

      guessedLetters.add(letter);

      if (secretWord.includes(letter)) {
        renderWord();
        checkWin();
      } else {
        errorCount++;
        document.getElementById(BODY_PARTS[errorCount - 1]).style.display = "block";
        checkLose();
      }

      renderKeyboard();
    }

    // Verificar si ganó
    function checkWin() {
      const isWon = [...secretWord].every(letter => guessedLetters.has(letter));
      if (isWon) {
        message.textContent = "¡Ganaste!";
        message.classList.add("win");
        disableKeyboard();
      }
    }

    // Verificar si perdió
    function checkLose() {
      if (errorCount >= MAX_ERRORS) {
        message.textContent = `Perdiste, la palabra era: ${secretWord}`;
        message.classList.add("lose");
        disableKeyboard();
      }
    }

    // Comprobar si el juego finalizó
    function isGameOver() {
      const isWon = [...secretWord].every(letter => guessedLetters.has(letter));
      return isWon || errorCount >= MAX_ERRORS;
    }

    // Deshabilitar todas las teclas
    function disableKeyboard() {
      const keys = keyboard.querySelectorAll(".key");
      keys.forEach(key => key.disabled = true);
    }

    // Escuchar entrada por teclado físico
    document.addEventListener("keydown", (e) => {
      const key = e.key.toUpperCase();
      if (/^[A-ZÑ]$/.test(key)) {
        handleGuess(key);
      }
    });

    // Evento del botón de reinicio
    resetBtn.addEventListener("click", initGame);

    // Inicialización al cargar la página
    initGame();
  </script>
</body>
</html>
